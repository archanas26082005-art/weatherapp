
<!DOCTYPE html>
<html>
<head>
    <title>Weather Application</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: lightblue;
            padding-top: 50px;
        }

        h1 {
            color: darkblue;
        }

        select, button {
            padding: 10px;
            margin: 10px;
            font-size: 16px;
        }

        button {
            background-color: darkblue;
            color: white;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 25px;
            font-size: 20px;
        }
    </style>
</head>

<body>

    <h1>Weather Application</h1>

    <select id="city">
        <option value="">Select City</option>
    </select>

    <button onclick="getWeather()">Get Weather</button>

    <div id="result"></div>

    <script>
        var weatherData = [
            {
                city: "Pondicherry",
                temperature: 30,
                condition: "Sunny"
            },
            {
                city: "Chennai",
                temperature: 32,
                condition: "Cloudy"
            },
            {
                city: "Bangalore",
                temperature: 25,
                condition: "Rainy"
            },
            {
                city: "Coimbatore",
                temperature: 28,
                condition: "Cloudy"
            },
            {
                city: "Madurai",
                temperature: 34,
                condition: "Sunny"
            }
        ];

        var select = document.getElementById("city");

        weatherData.forEach(function(item) {
            var option = document.createElement("option");

            option.value = item.city;
            option.textContent = item.city;

            select.appendChild(option);
        });

        function getWeather() {
            var selectedCity = select.value;

            var result = document.getElementById("result");

            if (selectedCity === "") {
                result.innerHTML = "Please select a city!";
                return;
            }

            var found = weatherData.find(function(item) {
                return item.city === selectedCity;
            });

            if (found) {
                result.innerHTML =
                    "<h2>" + found.city + "</h2>" +
                    "<p>Temperature: " +
                    found.temperature + "°C</p>" +
                    "<p>Condition: " +
                    found.condition + "</p>";
            }
        }
    </script>

</body>
</html>
